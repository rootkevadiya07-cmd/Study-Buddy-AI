services:
  - type: web
    name: studybuddy-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: AI_PROVIDER
        value: openai_compatible
      - key: API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL_NAME
        value: llama-3.1-8b-instant
      - key: API_KEY
        sync: false
